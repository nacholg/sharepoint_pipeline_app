name: Flight voucher regression tests

on:
  pull_request:
    paths:
      - "voucher_generator/**"
      - "tests/test_latin_grammys_flight_voucher.py"
      - "tests/test_latin_grammys_pdf_smoke.py"
      - ".github/workflows/flight-voucher-tests.yml"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pypdf
          python -m playwright install chromium --with-deps
      - name: Flight voucher regression
        run: python -m pytest -q tests/test_latin_grammys_flight_voucher.py tests/test_latin_grammys_pdf_smoke.py
